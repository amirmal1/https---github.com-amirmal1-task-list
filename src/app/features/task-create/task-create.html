

<ol>
@for (t of (tasks$ | async); track t.id) {



  <li [style.Color]="t.color">  {{t.title}} - {{t.details}} - {{t.color}} </li>

}
</ol>



<form class = "form" [formGroup]="taskForm"(ngSubmit)="onSubmit()">
<label>Title</label>
<input formControlName="title">
<label>Id</label>
<input formControlName="id">
<label>Details</label>
<textarea id="details" rows="3" formControlName="details"></textarea>
<label>color</label>
<input formControlName="color">

</form>

<button (click)="onSubmit()"[disabled]="taskForm.invalid">Submit Add Task</button>
<button (click)="onReset()">Clean</button>
