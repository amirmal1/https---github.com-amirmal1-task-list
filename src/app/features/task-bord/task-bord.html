
<ol>
@for (t of (tasks$ | async); track t.id) {
<li class="task-card">
  <button (click)="deleteTask(t.id)">Delete Task</button>
  <button (click)="onClick(t)">View Task</button>


  <div [style.Color]="t.color">{{t.title}} - {{t.details}}  -{{t.color}} - {{t.createdAt | date:'short'}}</div></li>

}
</ol>
<div class = "task-detail">
@if(currentTask === null) {
  <p>select a task</p>

}

@if(currentTask != null) {

  <h2>{{currentTask.title}}</h2>
  <p>{{currentTask.details}}</p>

}
</div>

<div><p>{{tasks$.details}}</p></div>
